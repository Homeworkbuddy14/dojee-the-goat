<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dojee - Homework Buddy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header with Dojee's Branding -->
  <header>
    <div class="header-container">
      <h1>Welcome to Dojee's Homework Buddy!</h1>
      <img src="https://example.com/dojee-logo.png" alt="Dojee Logo" class="dojee-logo">
    </div>
  </header>

  <!-- Login/Signup Section (will appear when not logged in) -->
  <div id="login-signup-container">
    <!-- Login Form -->
    <div id="login-form">
      <h3 class="form-title">Login</h3>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button onclick="login()" class="button">Login</button>
      <p>Don't have an account? <a href="#" onclick="toggleForms()" class="link">Sign up</a></p>
    </div>

    <!-- Signup Form -->
    <div id="signup-form" style="display: none;">
      <h3 class="form-title">Sign Up</h3>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button onclick="signup()" class="button">Sign Up</button>
      <p>Already have an account? <a href="#" onclick="toggleForms()" class="link">Login</a></p>
    </div>
  </div>

  <!-- Lessons Section (visible after login) -->
  <div id="lesson-section" style="display: none;">
    <h2>Choose your lesson, darling!</h2>
    <div id="lessons">
      <button onclick="startLesson('math')" class="lesson-button">Start Math Lesson</button>
      <button onclick="startLesson('reading')" class="lesson-button">Start Reading Lesson</button>
      <button onclick="startLesson('english')" class="lesson-button">Start English Lesson</button>
    </div>
  </div>

  <!-- Footer Section -->
  <footer>
    <p>Powered by Dojee &copy; 2025</p>
  </footer>

  <!-- JavaScript for Interactivity -->
  <script>
    let users = []; // Simulating user data

    // Toggle between Login and Signup forms
    function toggleForms() {
      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("signup-form");

      if (loginForm.style.display === "none") {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
      } else {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
      }
    }

    // Signup function
    function signup() {
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;

      if (email && password) {
        users.push({ email, password });
        alert("Account created! Now, login.");
        toggleForms(); 
      } else {
        alert("Please fill in all fields!");
      }
    }

    // Login function
    function login() {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        alert("Login successful! Welcome!");
        showLessons(); // Show lessons after successful login
      } else {
        alert("Invalid login. Please check your details.");
      }
    }

    // Show lessons section after successful login
    function showLessons() {
      document.getElementById("lesson-section").style.display = "block";
      document.getElementById("login-signup-container").style.display = "none";
    }

    // Start a lesson (dummy function for now)
    function startLesson(subject) {
      alert(`Starting ${subject} lesson!`);
      // Here you can link to your actual lesson system
    }
  </script>
</body>
</html>
